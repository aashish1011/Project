<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Login · Build &amp; Win</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}" />
</head>
<body>
  <main class="admin-shell">
    <section class="admin-card" aria-labelledby="admin-title">
      <p class="eyebrow">Build &amp; Win</p>
      <h1 id="admin-title">Admin sign in</h1>
      {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
      <form method="post" autocomplete="off">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
        <label>Username<input name="username" required maxlength="80" autocomplete="username" /></label>
        <label>Password<input name="password" type="password" required autocomplete="current-password" /></label>
        <button type="submit">Sign in</button>
      </form>
      <a href="{{ url_for('home') }}">Return to game</a>
    </section>
  </main>
</body>
</html>
